[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "online-eagle3"
version = "0.1.0"
description = "Standalone PyTorch CPU training for online EAGLE3"
requires-python = ">=3.10"
dependencies = ["torch>=2.6"]

[tool.setuptools]
packages = ["online_eagle3"]
package-dir = {online_eagle3 = "."}
